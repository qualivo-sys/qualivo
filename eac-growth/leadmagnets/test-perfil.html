<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test: ¿tu perfil es de cabina o de tierra? · EAC</title>
<meta name="description" content="Ocho preguntas para saber si encajas mejor como TCP volando o trabajando en tierra en el aeropuerto.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/eac.css">
</head>
<body>
<div class="bar"><div class="in">
  <a class="logo" href="/">Escola Aeronàutica <em>de Catalunya</em></a>
  <span class="tag">Test de perfil</span>
</div></div>

<main class="shell">
  <section class="card" id="app">
    <span class="kicker">Test de orientación · 1 minuto</span>
    <h1>¿Cabina, tierra u operaciones?</h1>
    <p class="lead">La duda más repetida de quien quiere entrar al sector aéreo. Ocho preguntas sobre tu vida real, no sobre lo que suena mejor.</p>
    <div class="prog"><i></i></div>
    <div class="pstep" id="pstep">Pregunta 1 de 8</div>
    <div id="quiz"></div>
  </section>
  <div id="after"></div>
</main>

<footer class="f">Escola Aeronàutica de Catalunya · Barcelona</footer>

<script src="/assets/eac.js"></script>
<script>
window.EAC_MAGNET='lm_test_perfil';
// cada opción reparte puntos: [cabina, tierra, operaciones]
var QS=[
 {t:'¿Podrías dormir fuera de casa varias noches al mes?',
  opts:[{t:'Sí, es parte del atractivo',p:[3,0,0]},{t:'Alguna vez sí',p:[1,1,1]},{t:'No, necesito volver a casa',p:[0,3,2]}]},
 {t:'¿Qué te motiva más de trabajar en aviación?',
  opts:[{t:'Viajar y conocer destinos',p:[3,0,0]},{t:'El ambiente del aeropuerto',p:[0,3,1]},{t:'Entender cómo funciona la operación por dentro',p:[0,1,3]}]},
 {t:'¿Cómo llevas el trato constante con público?',
  opts:[{t:'Me encanta, se me da bien',p:[2,3,0]},{t:'Bien, aunque cansa',p:[2,2,1]},{t:'Prefiero trabajo técnico y con menos público',p:[0,0,3]}]},
 {t:'¿Y trabajar con datos, normativa y procedimientos?',
  opts:[{t:'Me gusta el detalle y el procedimiento',p:[1,1,3]},{t:'Lo hago si toca',p:[2,2,1]},{t:'Me aburre soberanamente',p:[2,2,0]}]},
 {t:'¿Qué prefieres físicamente?',
  opts:[{t:'Movimiento y estar de pie',p:[3,2,0]},{t:'Trabajo físico y al aire libre',p:[0,3,0]},{t:'Estar en una mesa concentrado',p:[0,0,3]}]},
 {t:'¿Cuándo necesitas estar trabajando?',
  opts:[{t:'Cuanto antes, aunque sea temporal',p:[0,3,1]},{t:'En unos meses, con formación de por medio',p:[3,1,2]},{t:'Sin prisa, quiero la mejor opción',p:[2,0,3]}]},
 {t:'¿Qué te preocupa más de un empleo?',
  opts:[{t:'Que el sueldo tenga techo bajo',p:[3,0,2]},{t:'La inestabilidad y la temporalidad',p:[0,1,3]},{t:'Aburrirme haciendo lo mismo',p:[3,1,1]}]},
 {t:'Los turnos de madrugada y festivos...',
  opts:[{t:'Los asumo sin problema',p:[2,3,1]},{t:'Prefiero horario más previsible',p:[0,0,3]},{t:'Me da igual con tal de entrar al sector',p:[2,2,2]}]}
];

EAC.Quiz({questions:QS,onFinish:function(a){
  var s=[0,0,0];
  a.forEach(function(o){ o.p.forEach(function(v,i){ s[i]+=v; }); });
  var total=s[0]+s[1]+s[2];
  var names=['Cabina (TCP)','Tierra (agente de pasaje o rampa)','Operaciones (despachador de vuelo)'];
  var cursos=['TCP','AT','FD'];
  var idx=s.indexOf(Math.max.apply(null,s));
  var pct=s.map(function(v){return Math.round(v/total*100)});
  var app=EAC.$('#app');
  app.innerHTML=
   '<span class="kicker">Resultado</span>'
  +'<h1>Tu perfil encaja mejor en <span style="color:var(--red)">'+names[idx].split(' (')[0].toLowerCase()+'</span></h1>'
  +'<p class="lead">'+explica(idx)+'</p>'
  +'<div class="stats">'
  + s.map(function(v,i){return '<div class="stat" style="border-top-color:'+(i===idx?'#D8232A':'#D3DAE3')+'"><b>'+pct[i]+'%</b><span>'+names[i]+'</span></div>'}).join('')
  +'</div>'
  +'<p class="small">Es una orientación basada en tus respuestas sobre disponibilidad, trato con público y tipo de trabajo. No es un veredicto: mucha gente empieza en una vía y se mueve a otra.</p>';
  EAC.gate(EAC.$('#after'),{
    title:'Te enviamos la comparativa completa',
    sub:'Requisitos, sueldos, turnos y velocidad de acceso de las tres vías, una al lado de la otra.',
    why:'Recibirás la comparativa de las tres salidas y, si quieres, te llamamos para ver cuál encaja con tu situación concreta.',
    cta:'Enviarme la comparativa',
    extra:{curso:cursos[idx], perfil:names[idx], reparto:pct},
    onDone:function(d,res){
      EAC.$('#after').innerHTML=
       '<div class="card"><span class="kicker">Enviado</span>'
      +'<h2>Gracias, '+d.nombre.split(' ')[0]+'</h2>'
      +'<p>La comparativa va camino de <b>'+d.email+'</b>.</p>'
      +'<div class="cta"><h3>¿Lo vemos en 10 minutos?</h3><p>Te orientamos entre cabina, tierra y operaciones según tus horarios y tus objetivos.</p>'
      +'<a class="btn" href="https://escolaeronauticadecatalunya.cat/contacto/?utm_source=leadmagnet&utm_medium=test&utm_campaign=lm_test_perfil">Quiero que me orienten</a></div>'
      +'<p class="tiny" style="margin-top:16px">Puntuación asignada a este lead: <b>'+(res&&res.score!=null?res.score:'—')+'</b> · '+(res&&res.tag?res.tag:'—')+'.</p></div>';
      window.scrollTo({top:EAC.$('#after').offsetTop-20,behavior:'smooth'});
    }
  });
  EAC.$('#after').scrollIntoView({behavior:'smooth',block:'start'});
}});

function explica(i){
  return [
   'Tienes disponibilidad para estar fuera de casa, te mueves bien con el público y buscas recorrido económico. Ese es exactamente el perfil que las aerolíneas buscan en cabina.',
   'Necesitas base fija y quieres entrar al sector pronto. El aeropuerto contrata todo el año y es la vía más rápida, con recorrido claro hacia coordinación y supervisión.',
   'Te mueves bien con procedimientos y datos, y prefieres trabajo técnico con horario más previsible. El despacho de vuelo es el área con menos competencia por plaza del sector.'
  ][i];
}
</script>
</body>
</html>
