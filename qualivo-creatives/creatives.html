<!doctype html>
<meta charset="utf-8">
<title>Qualivo · Serie "Dónde está la fuga"</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  :root{
    --bg:#0F0F0F;
    --cream:#F0EBE1;
    --orange:#FF6A2B;
    --grey:#A8A39B;
    --hair:rgba(240,235,225,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2a2a2a;font-family:'Poppins',system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:28px;padding:28px}

  .artboard{
    width:1080px;height:1350px;flex:0 0 auto;
    background:var(--bg);color:var(--cream);
    padding:72px;display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }
  .sp{flex-grow:1}

  /* 1 · barra superior */
  .bar{height:34px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:'Anton';font-size:27px;letter-spacing:.075em;color:var(--orange);line-height:1}
  .serie{font-size:15px;font-weight:600;letter-spacing:.16em;color:var(--orange);opacity:.8}

  /* 2 · titular */
  .head{flex:0 0 auto;display:flex;align-items:flex-start}
  .head h1{
    font-family:'Anton';text-transform:uppercase;line-height:.96;
    letter-spacing:.005em;font-weight:400;font-size:104px;
  }

  /* 3 · diagrama */
  .pipe{height:172px;display:flex;align-items:flex-start}
  .node{width:96px;display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
  .tagslot{height:40px;display:flex;align-items:flex-end;justify-content:center}
  .tag{
    position:relative;background:var(--orange);color:#0F0F0F;
    font-family:'Anton';font-size:16px;letter-spacing:.11em;
    padding:6px 12px 5px;border-radius:5px;line-height:1;
  }
  .tag::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid var(--orange)}
  .ring{height:90px;display:flex;align-items:center;justify-content:center}
  .circ{width:72px;height:72px;border-radius:50%;border:1.6px solid var(--hair);
    display:flex;align-items:center;justify-content:center}
  .circ svg{width:28px;height:28px;stroke:var(--cream);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  .node.on .circ{width:86px;height:86px;background:var(--orange);border-color:var(--orange);
    box-shadow:0 0 0 9px rgba(255,106,43,.16)}
  .node.on .circ svg{stroke:#0F0F0F;width:33px;height:33px;opacity:1;stroke-width:1.9}
  .label{margin-top:14px;height:22px;font-size:15px;white-space:nowrap;font-weight:500;color:var(--cream);opacity:.5;line-height:22px}
  .node.on .label{color:var(--orange);opacity:1;font-weight:600}
  .node.dead{opacity:.3}

  .conn.trail{flex:0 0 58px}
  .pipe.hastrail{margin-right:-58px}
  .conn{flex:1 1 auto;height:1.6px;background:var(--hair);margin-top:85px;position:relative}
  .conn.dead{opacity:.3}
  .conn.broken{background:none;display:flex;align-items:center}
  .conn.broken .s1{height:3px;background:var(--orange);width:24%;border-radius:2px;margin-top:-.7px;position:relative}
  .conn.broken .s1::after{content:"";position:absolute;right:-1px;top:0;width:11px;height:3px;
    background:var(--orange);border-radius:2px;transform:rotate(30deg);transform-origin:left center}
  .conn.broken .hole{flex:1 1 auto;height:1.6px;position:relative}
  .conn.broken .s2{height:1.6px;background:var(--hair);width:24%;opacity:.3;position:relative}
  .conn.broken .s2::before{content:"";position:absolute;left:-1px;top:0;width:11px;height:1.6px;
    background:var(--hair);transform:rotate(30deg);transform-origin:right center}
  .drip{position:absolute;left:50%;border-radius:50%;background:var(--orange)}
  .d1{width:7px;height:7px;top:13px;margin-left:-9px;opacity:.9}
  .d2{width:5.5px;height:5.5px;top:30px;margin-left:0;opacity:.55}
  .d3{width:4px;height:4px;top:47px;margin-left:-7px;opacity:.3}

  /* 4 · línea de apoyo */
  .support{height:60px;font-size:28px;font-weight:400;color:var(--grey);line-height:1.38;max-width:930px}

  /* 5 · constante de marca */
  .fix{height:90px;font-size:33px;font-weight:600;line-height:1.34;max-width:930px}
  .fix b{font-weight:600;color:var(--orange)}

  /* 6 · inversión del riesgo */
  .risk{height:52px;font-family:'Anton';font-size:47px;letter-spacing:.01em;
    text-transform:uppercase;color:var(--orange);line-height:52px}

  /* 7 · llamada a la acción */
  .cta{height:92px;background:var(--orange);border-radius:14px;color:#0F0F0F;
    display:flex;align-items:center;justify-content:center;gap:16px}
  .cta .a{font-size:27px;font-weight:700;letter-spacing:.005em}
  .cta .b{font-family:'Anton';font-size:27px;letter-spacing:.07em;opacity:.62}

  /* 8 · pie */
  .foot{height:24px;display:flex;align-items:center;justify-content:space-between;
    font-size:17px;color:var(--grey);opacity:.75}
</style>
<body></body>
<script>
const ICON = {
  ad:'<svg viewBox="0 0 24 24"><path d="M4 9v6h3l6 4V5L7 9H4z"/><path d="M17.5 9.2a4 4 0 0 1 0 5.6"/><path d="M20 6.8a7.5 7.5 0 0 1 0 10.4"/></svg>',
  web:'<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><path d="M3 9h18"/><circle cx="6.6" cy="6.8" r=".7" fill="currentColor" stroke="none"/></svg>',
  user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 19.5a7.2 7.2 0 0 1 14.4 0"/></svg>',
  call:'<svg viewBox="0 0 24 24"><path d="M7.2 3.8 9.4 4l1.2 3.3-1.9 1.5a11.5 11.5 0 0 0 5.5 5.5l1.5-1.9 3.3 1.2.2 2.2a2 2 0 0 1-2.2 2.2A15.6 15.6 0 0 1 5 6a2 2 0 0 1 2.2-2.2z"/></svg>',
  doc:'<svg viewBox="0 0 24 24"><rect x="5" y="3.2" width="14" height="17.6" rx="2.2"/><path d="M8.6 8h6.8M8.6 12h6.8M8.6 16h4.2"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7.5 20v-6M12 20V6M16.5 20v-9"/></svg>'
};
const STAGES = [
  {k:'ad',    label:'Anuncio'},
  {k:'web',   label:'Web'},
  {k:'user',  label:'Contacto'},
  {k:'call',  label:'Llamada'},
  {k:'doc',   label:'Seguimiento'},
  {k:'chart', label:'Venta'}
];

/* CONSTANTES DE LA SERIE — se repiten sin cambios en las 6 piezas */
const FIX  = 'Encontramos la fuga y la arreglamos <b>dentro del sistema que ya tienes.</b>';
const RISK = 'Si no se mueve, no pagas.';
const CTA  = {a:'Diagnóstico de 15 min en', b:'QUALIVO.IO'};
const FOOT = {l:'@maikel.echevarria', r:'Un mes. Acordamos un número y lo movemos.'};

/* VARIABLES POR PIEZA
   proof: hueco reservado para un dato real de Qualivo. Vacío a propósito:
   no se inventan cifras. Rellenar cuando exista el dato. */
const PIECES = [
  { i:0, slug:'anuncio',
    head:'Llevas 40 días con el mismo anuncio. Nadie ha abierto el panel.',
    support:'El gasto se ejecuta solo todos los días. La revisión, no.',
    proof:'' },
  { i:1, slug:'web',
    head:'Rellenó tres campos. Vio el cuarto. Cerró la pestaña.',
    support:'Pagas el clic entero y el formulario se queda con la mitad.',
    proof:'' },
  { i:2, slug:'contacto',
    head:'Tercer formulario que rellena. Para vosotros son tres personas.',
    support:'Un contacto duplicado se trabaja tres veces o no se trabaja ninguna.',
    proof:'' },
  { i:3, slug:'llamada',
    head:'Te pidió precio a las 23:40. Le contestaste a las 10.',
    support:'Contestar el primero es media venta. Y a esa hora no contesta nadie.',
    proof:'' },
  { i:4, slug:'seguimiento',
    head:'Te dijo que en marzo no. Nadie ha vuelto a llamarle.',
    support:'Un «ahora no» es un «todavía no». Casi nunca vuelve a mirarse.',
    proof:'' },
  { i:5, slug:'venta',
    head:'Cerraste ocho este mes. No sabes de qué anuncio salió ninguno.',
    support:'Sin saber qué anuncio vende, el presupuesto se reparte a ciegas.',
    proof:'' }
];

function pipeline(active){
  let h = '';
  STAGES.forEach((s, n) => {
    if (n > 0){
      const cls = n - 1 === active ? 'conn broken' : (n - 1 > active ? 'conn dead' : 'conn');
      h += n - 1 === active
        ? `<div class="${cls}"><span class="s1"></span><span class="hole"><i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i></span><span class="s2"></span></div>`
        : `<div class="${cls}"></div>`;
    }
    const cls = n === active ? 'node on' : (n > active ? 'node dead' : 'node');
    h += `<div class="${cls}">
      <div class="tagslot">${n === active ? '<span class="tag">FUGA</span>' : ''}</div>
      <div class="ring"><div class="circ">${ICON[s.k]}</div></div>
      <div class="label">${s.label}</div>
    </div>`;
  });
  if (active === STAGES.length - 1){
    h += `<div class="conn broken trail"><span class="s1"></span><span class="hole"><i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i></span><span class="s2"></span></div>`;
  }
  return h;
}

document.body.innerHTML = PIECES.map(p => `
  <section class="artboard" data-slug="${p.slug}" data-n="${p.i + 1}">
    <div class="bar">
      <div class="logo">QUALIVO</div>
      <div class="serie">FUGA 0${p.i + 1} / 06</div>
    </div>
    <div class="sp" style="flex-grow:.85"></div>
    <div class="head"><h1>${p.head}</h1></div>
    <div class="sp" style="flex-grow:.7"></div>
    <div class="pipe${p.i === 5 ? ' hastrail' : ''}">${pipeline(p.i)}</div>
    <div class="sp" style="flex-grow:.95"></div>
    <div class="support">${p.support}</div>
    <div class="sp" style="flex-grow:.55"></div>
    <div class="fix">${FIX}</div>
    <div class="sp" style="flex-grow:1.05"></div>
    <div class="risk">${RISK}</div>
    <div class="sp" style="flex-grow:.3"></div>
    <div class="cta"><span class="a">${CTA.a}</span><span class="b">${CTA.b}</span></div>
    <div class="sp" style="flex-grow:.35"></div>
    <div class="foot"><span>${FOOT.l}</span><span>${FOOT.r}</span></div>
  </section>`).join('');

/* Ajuste del titular al bloque fijo: la plantilla ya no cambia de forma
   según la longitud del texto. */
document.querySelectorAll('.head').forEach(box => {
  const h1 = box.querySelector('h1');
  const MAX_H = 300;
  let size = 94;
  h1.style.fontSize = size + 'px';
  while (size > 48 && (h1.scrollHeight > MAX_H || h1.scrollWidth > box.clientWidth)){
    size -= 1;
    h1.style.fontSize = size + 'px';
  }
});
document.documentElement.dataset.ready = '1';
</script>
