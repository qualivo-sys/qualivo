<!DOCTYPE html><html lang="es"><meta charset="utf-8">
<!-- VSL Qualivo · capa de gráficos (fondo transparente) para el montaje 16:9.
     Marca de la web: Montserrat, navy, turquesa #27BDB1, coral #E8590C.
     Los tiempos (window.TL) los escribe vsl_gancho.py según el corte final. -->
<link rel="stylesheet" href="../../../assets/fonts/montserrat.css">
<style>
@font-face{font-family:M;src:url(../../../assets/fonts/montserrat-latin.woff2) format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:1920px;height:1080px;overflow:hidden;font-family:M,sans-serif}
.l{position:absolute;opacity:0}
/* subtítulos limpios, dos líneas como mucho */
#sub{left:260px;right:260px;bottom:70px;text-align:center;font-size:40px;font-weight:600;line-height:1.3;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.9)}
#sub b{color:#27BDB1;font-weight:800}
#e.split #sub{left:40px;right:1000px;font-size:36px}
/* frase clave */
.clave{left:50%;transform:translateX(-50%);top:120px;background:#0A0F1A;color:#fff;font-weight:800;font-size:58px;
  letter-spacing:.01em;padding:22px 40px;border-radius:14px;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.clave i{font-style:normal;color:#27BDB1}
.clave.coral i{color:#FF8A4C}
/* panel derecho (pantalla partida) */
#panel{left:960px;top:0;width:960px;height:1080px;background:#0A0F1A;padding:150px 110px 0}
#panel .k{font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#27BDB1;font-weight:700;margin-bottom:34px}
.card{background:#141B2B;border:2px solid #24304A;border-radius:18px;padding:26px 32px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;opacity:0}
.card span{font-size:30px;color:#B9C2D3;font-weight:600}
.card b{font-size:46px;color:#fff;font-weight:800}
.card.q{border-color:#E8590C;background:#2A1710}
.card.q span{color:#FFD9C4}.card.q b{color:#FF8A4C}
#panel .ej{position:absolute;left:110px;bottom:60px;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#6B7690;font-weight:700}
/* pantalla completa: un anuncio para todo el mundo */
#todos{inset:0;background:#0A0F1A;display:flex;flex-direction:column;align-items:center;padding-top:120px}
#todos h2{font-size:64px;font-weight:800;color:#fff;margin-bottom:12px}
#todos h3{font-size:44px;font-weight:700;color:#27BDB1;opacity:0}
#gente{display:grid;grid-template-columns:repeat(16,48px);gap:18px;margin-top:70px}
#gente i{width:48px;height:48px;border-radius:50%;background:#2A3550;display:block;opacity:0}
#gente i.ok{background:#27BDB1}
/* rótulo de nombre */
#nombre{left:110px;bottom:190px;background:#fff;border-left:10px solid #27BDB1;padding:18px 30px 18px 26px;border-radius:6px}
#nombre b{display:block;font-size:40px;font-weight:800;color:#0A0F1A}
#nombre span{font-size:26px;font-weight:600;color:#4A5568}
</style>
<div id="e" style="position:absolute;inset:0">
  <div class="l" id="panel"><div class="k">Lo que sí saben</div>
    <div class="card" id="c1"><span>Coste por contacto</span><b>12 €</b></div>
    <div class="card" id="c2"><span>Formularios</span><b>340</b></div>
    <div class="card" id="c3"><span>Inversión</span><b>4.100 €</b></div>
    <div class="card q" id="c4"><span>¿Personas adecuadas?</span><b>?</b></div>
    <div class="ej">Datos de ejemplo</div></div>
  <div class="l" id="todos"><h2>Un anuncio para todo el mundo</h2><h3>…atrae a todo el mundo.</h3><div id="gente"></div></div>
  <div class="l clave" id="k1">¿Qué anuncios <i>generan negocio?</i></div>
  <div class="l clave coral" id="k2">Leads baratos <i>≠ buenos clientes</i></div>
  <div class="l" id="nombre"><b>Maikel Echevarría</b><span>Fundador de Qualivo</span></div>
  <div class="l" id="sub"></div>
</div>
<script src="tiempos-gancho.js"></script>
<script>
const $=id=>document.getElementById(id);
const TL=window.TL; const cl=(x,a,b)=>Math.max(a,Math.min(b,x)); const nm=(t,a,b)=>cl((t-a)/(b-a),0,1); const out=x=>1-Math.pow(1-x,3);
function win(t,a,b,fi=.25,fo=.2){ if(t<a||t>b) return 0; return Math.min(nm(t,a,a+fi),1-nm(t,b-fo,b)); }
function show(el,op,dy=0,base=''){ el.style.opacity=op; el.style.transform=base+` translateY(${(1-out(op))*dy}px)`; }
const G=$('gente'); const OK=new Set([5,22,41,58,71]); for(let i=0;i<80;i++){const d=document.createElement('i'); if(OK.has(i)) d.className='ok'; G.appendChild(d);}
window.setT=function(t){
  const sp=t>=TL.split[0]&&t<TL.split[1]; $('e').className=sp?'split':'';
  show($('panel'),win(t,TL.split[0],TL.split[1],.3,.25),0);
  ['c1','c2','c3','c4'].forEach((c,i)=>show($(c),nm(t,TL.cards[i],TL.cards[i]+.35),24));
  const tw=win(t,TL.todos[0],TL.todos[1],.3,.3); show($('todos'),tw,0);
  $('todos').querySelector('h3').style.opacity=nm(t,TL.todos2,TL.todos2+.4);
  [...G.children].forEach((d,i)=>{d.style.opacity=nm(t,TL.todos[0]+.4+i*.018,TL.todos[0]+.6+i*.018); if(d.classList.contains('ok')) d.style.opacity*= (t>TL.todos2? .35:1);});
  show($('k1'),win(t,TL.k1[0],TL.k1[1],.25,.25),-20,'translateX(-50%)');
  show($('k2'),win(t,TL.k2[0],TL.k2[1],.25,.25),-20,'translateX(-50%)');
  show($('nombre'),win(t,TL.nombre[0],TL.nombre[1],.35,.3),20);
  const s=TL.subs.find(x=>t>=x[0]&&t<x[1]); const sb=$('sub');
  if(s && !(t>=TL.todos[0]&&t<TL.todos[1])){ sb.innerHTML=s[2]; sb.style.opacity=1; } else sb.style.opacity=0;
};
window.setT(0);
</script>
