<meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(../../anuncios/2026-09-11-v2/fuentes/anton.ttf) format('truetype')}
@font-face{font-family:SG;src:url(../../infografias/2026-09-10/fuentes/spacegrotesk.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
#e{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0A0A0B;color:#F2EEE6;font-family:SG}
#shake{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:#FF7A33;opacity:0;pointer-events:none}
.marca{position:absolute;left:70px;top:250px;font-family:Anton;font-size:32px;color:#FF7A33;opacity:0}
#tit{position:absolute;left:70px;top:430px;width:950px;font-family:Anton;font-size:104px;line-height:1.02;
     text-transform:uppercase;opacity:0;transform-origin:left center}
#tit em{font-style:normal;color:#FF7A33}
#ruta{position:absolute;left:0;top:930px;width:1080px;height:260px;opacity:0}
.nodo{position:absolute;top:0;width:118px;height:118px;border-radius:50%;border:4px solid #33363E;
      display:flex;align-items:center;justify-content:center;color:#6E737F;background:#0A0A0B;z-index:2}
.nodo svg{width:56px;height:56px}
.etq{position:absolute;top:140px;width:190px;margin-left:-36px;text-align:center;font-size:23px;color:#7E838F;line-height:1.2}
.tramo{position:absolute;top:57px;height:4px;background:#33363E;z-index:1}
.bola{position:absolute;border-radius:50%;background:#FF7A33;z-index:3;opacity:0}
#glob{position:absolute;top:-104px;font-family:Anton;font-size:26px;background:#FF7A33;color:#0A0A0B;
      padding:9px 17px;border-radius:8px;white-space:nowrap;opacity:0;transform-origin:center bottom}
#glob:after{content:'';position:absolute;left:50%;margin-left:-9px;bottom:-9px;border:9px solid transparent;border-top-color:#FF7A33;border-bottom:0}
#perdidos{position:absolute;left:0;top:1260px;width:1080px;text-align:center}
.caido{display:inline-block;width:26px;height:26px;border-radius:50%;background:#4A2A18;margin:0 9px;opacity:0}
#nota{position:absolute;left:70px;top:1340px;width:950px;text-align:center;font-size:34px;color:rgba(242,238,230,.55);opacity:0}
.bl{position:absolute;left:70px;width:950px;opacity:0}
#sol{top:1330px;font-family:Anton;font-size:74px;line-height:1.05;text-transform:uppercase}
#sol em{font-style:normal;color:#FF7A33}
#gar{top:1360px;font-family:Anton;font-size:58px;line-height:1.06;text-transform:uppercase}
#gar span{color:#FF7A33}
#cta{top:1610px;display:flex;align-items:center;gap:22px}
#cta .bt{background:#FF7A33;color:#0A0A0B;font-family:Anton;font-size:34px;padding:21px 32px;border-radius:11px}
#cta .ex{font-size:26px;color:rgba(242,238,230,.6);line-height:1.3}
.pie{position:absolute;bottom:250px;font-size:22px;color:rgba(242,238,230,.3);opacity:0}
.pieL{left:70px}.pieR{right:70px;font-family:Anton;font-size:24px;color:rgba(255,122,51,.7)}
</style>

<div id="e"><div id="shake">
  <div class="marca" id="marca">QUALIVO</div>
  <div id="tit"></div>
  <div id="ruta"></div>
  <div id="perdidos"></div>
  <div id="nota">Y así un día detrás de otro.</div>
  <div class="bl" id="sol">Encontramos<br>la fuga.</div>
  <div class="bl" id="gar">Acordamos un número.<br>Si en un mes no se mueve,<br><span>no pagas el piloto.</span></div>
  <div class="bl" id="cta"><div class="bt">PIDE EL DIAGNÓSTICO →</div><div class="ex">15 minutos.<br>Te decimos qué vemos.</div></div>
  <div class="pie pieL" id="pl">@maikel.echevarria</div><div class="pie pieR" id="pr">QUALIVO.IO</div>
</div><div id="flash"></div></div>

<script>
const IC={anuncio:'<path d="M4 11v6h4l8 5V6l-8 5H4z"/><path d="M19 9c1.2 1 1.2 5 0 6" fill="none" stroke-width="2.1"/>',
web:'<rect x="3" y="5" width="18" height="15" rx="2.5" fill="none" stroke-width="2.1"/><path d="M3 10h18" stroke-width="2.1"/><circle cx="6.5" cy="7.5" r="1"/>',
contacto:'<circle cx="12" cy="8.5" r="3.6" fill="none" stroke-width="2.1"/><path d="M5 20c1.4-3.6 4-5.2 7-5.2s5.6 1.6 7 5.2" fill="none" stroke-width="2.1"/>',
llamada:'<path d="M6.2 3.8h3.4l1.7 4.3-2.2 1.5a12 12 0 0 0 5.3 5.3l1.5-2.2 4.3 1.7v3.4c0 1-.8 1.9-1.9 1.8C10.6 19.9 4.1 13.4 3.4 5.7c-.1-1.1.8-1.9 1.8-1.9z" fill="none" stroke-width="2.1"/>',
seguimiento:'<rect x="5" y="3" width="14" height="18" rx="2.2" fill="none" stroke-width="2.1"/><path d="M9 8h6M9 12h6M9 16h3" stroke-width="2.1"/>',
venta:'<path d="M4 19h16" stroke-width="2.1"/><path d="M7 19v-5M12 19V8M17 19v-9" stroke-width="2.1"/>'};
const N=[['anuncio','Anuncio'],['web','Web'],['contacto','Contacto'],['llamada','Llamada'],['seguimiento','Seguimiento'],['venta','Venta']];
const FUGA=3, M=70, D=118, W=1080-M*2, PASO=(W-D)/(N.length-1), ESTELA=7;
const ruta=document.getElementById('ruta'); let h='';
for(let i=0;i<N.length-1;i++) h+=`<div class="tramo" id="tr${i}" style="left:${M+i*PASO+D}px;width:${PASO-D}px"></div>`;
N.forEach(([k,e],i)=>{h+=`<div class="nodo" id="nd${i}" style="left:${M+i*PASO}px"><svg viewBox="0 0 24 24" stroke="currentColor" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg></div><div class="etq" id="eq${i}" style="left:${M+i*PASO+D/2}px">${e}</div>`;});
for(let s=0;s<ESTELA;s++) h+=`<div class="bola" id="bo${s}"></div>`;
h+=`<div id="glob" style="left:${M+FUGA*PASO+D/2-96}px">SE PIERDE AQUÍ</div>`;
ruta.innerHTML=h;
let pd=''; for(let i=0;i<3;i++) pd+=`<span class="caido" id="ca${i}"></span>`;
document.getElementById('perdidos').innerHTML=pd;

const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), nm=(t,a,b)=>cl((t-a)/(b-a),0,1);
const outQ=x=>1-Math.pow(1-x,3), inQ=x=>x*x, io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const S=(id,o,tr)=>{const n=document.getElementById(id);n.style.opacity=o;if(tr!==undefined)n.style.transform=tr;};
const cx=i=>M+i*PASO+D/2;

// el cliente: cabeza + estela, y una caida con peso
function bola(t,ini,dur,hasta,cae){
  const vivo = t>=ini && t<=ini+dur+(cae?.7:.25);
  for(let s=0;s<ESTELA;s++){
    const el=document.getElementById('bo'+s);
    if(!vivo){el.style.opacity=0;continue;}
    const ts=t-s*0.028, p=nm(ts,ini,ini+dur);
    if(ts<ini){el.style.opacity=0;continue;}
    let x=cx(0)+outQ(p)*(cx(hasta)-cx(0)), y=59, op=1-s/ESTELA*0.85, r=30-s*2.6;
    if(cae&&p>=1){const q=nm(ts,ini+dur,ini+dur+.7); y=59+inQ(q)*420; x+=q*34; op*=(1-q);}
    else if(!cae&&p>=1){const q=nm(ts,ini+dur,ini+dur+.25); op*=(1-q);}
    el.style.cssText=`position:absolute;border-radius:50%;background:#FF7A33;z-index:3;width:${r*2}px;height:${r*2}px;left:${x-r}px;top:${y-r+30}px;opacity:${op};box-shadow:0 0 ${34-s*4}px ${11-s}px rgba(255,122,51,${.5-s*.06})`;
  }
}
const CAIDAS=[[3.05,1.35],[4.75,1.0],[6.05,0.78]];

window.setT=function(t){
  // entrada: primero el recorrido, grande y solo
  S('ruta', nm(t,.2,1.0));
  S('marca', nm(t,.5,1.1));
  S('pl', nm(t,.5,1.1)); S('pr', nm(t,.5,1.1));

  const tit=document.getElementById('tit');
  let txt='', op=0, sc=1;
  if(t<5.0){ txt='Te pidió precio<br><em>a las 23:40.</em>'; const a=nm(t,1.25,1.75); op=a; sc=.92+.08*outQ(a); }
  else if(t<8.4){ txt='Le contestaste<br><em>a las 10.</em>'; const a=nm(t,5.15,5.6); op=a*(1-nm(t,8.0,8.4)); sc=.92+.08*outQ(a); }
  tit.innerHTML=txt; tit.style.opacity=op; tit.style.transform=`scale(${sc})`;

  // tres clientes, cada vez mas rapidos, que se caen en el mismo sitio
  let roto=false, nca=0, sac=0;
  const reparado=t>=9.55;
  if(!reparado){
    for(let i=0;i<CAIDAS.length;i++){
      const [ini,dur]=CAIDAS[i];
      if(t>=ini && t<=ini+dur+.7) bola(t,ini,dur,FUGA,true);
      if(t>ini+dur) {roto=true; nca=i+1; const g=nm(t,ini+dur,ini+dur+.22); if(g>0&&g<1) sac=Math.sin(g*Math.PI*4)*(1-g)*17;}
    }
  }
  document.getElementById('shake').style.transform=`translate(${sac}px,${sac*.5}px)`;
  S('flash', roto? Math.max(0,...CAIDAS.map(([i,d])=>t>i+d? (1-nm(t,i+d,i+d+.16))*.14 :0)) : 0);

  for(let i=0;i<3;i++) S('ca'+i, (!reparado && i<nca)?1:0);
  S('nota', (!reparado)? nm(t,7.15,7.6)*(1-nm(t,8.5,8.8)) : 0);

  for(let i=0;i<N.length;i++){
    const nd=document.getElementById('nd'+i), eq=document.getElementById('eq'+i);
    const marcado = (i===FUGA) && (roto||reparado);
    nd.style.borderColor = marcado?'#FF7A33':'#33363E';
    nd.style.background  = marcado?'#FF7A33':'#0A0A0B';
    nd.style.color       = marcado?'#0A0A0B':'#6E737F';
    nd.style.boxShadow   = marcado?'0 0 0 14px rgba(255,122,51,.16)':'none';
    eq.style.color = marcado?'#FF7A33':'#7E838F';
    eq.style.fontWeight = marcado?'700':'400';
    const apagado = roto && !reparado && i>FUGA;
    nd.style.opacity = apagado?.24:1; eq.style.opacity = apagado?.24:1;
  }
  S('glob', roto&&!reparado? nm(t,3.55,3.85)*(1-nm(t,8.5,8.8)) : 0,
    `scale(${.6+.4*outQ(nm(t,3.55,3.9))})`);

  // giro: se repara y el cliente llega hasta el final
  S('sol', nm(t,8.7,9.15)*(1-nm(t,12.0,12.35)), `translateY(${(1-io(nm(t,8.7,9.15)))*26}px)`);
  const sol=document.getElementById('sol');
  sol.innerHTML = t<11.0 ? 'Encontramos<br>la fuga.' : 'Y la arreglamos<br><em>dentro de tu sistema.</em>';
  if(reparado && t<12.4) bola(t,9.75,2.0,N.length-1,false);
  const av = io(nm(t,9.75,11.75))*(N.length-1);
  for(let i=0;i<N.length-1;i++){
    const tr=document.getElementById('tr'+i);
    tr.style.background = (reparado && av>i+0.75) ? '#FF7A33' : (roto&&!reparado&&i===FUGA?'rgba(51,54,62,.25)':'#33363E');
  }
  if(reparado) for(let i=0;i<N.length;i++){
    if(av>i-0.25){const nd=document.getElementById('nd'+i),eq=document.getElementById('eq'+i);
      nd.style.borderColor='#FF7A33'; nd.style.opacity=1; eq.style.opacity=1; eq.style.color='#FF7A33';}
  }
  S('gar', nm(t,12.5,12.95), `translateY(${(1-io(nm(t,12.5,12.95)))*26}px)`);
  S('cta', nm(t,13.15,13.6), `translateY(${(1-io(nm(t,13.15,13.6)))*26}px)`);
};
window.setT(0);
</script>
