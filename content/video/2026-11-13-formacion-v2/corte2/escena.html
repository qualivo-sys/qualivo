<!DOCTYPE html><html lang="es"><meta charset="utf-8">
<!-- Formación V2 · corte 2 (prueba visual). escena.html?ver=larga|corta&ap=h1|h2&fmt=916|45 · window.setT(t)
     Pantallas: capturas reales de Qualivo Intelligence, historia de demostración «Laura» (datos simulados). -->
<style>
@font-face{font-family:Mont;font-weight:100 900;src:url(rec/montserrat-latin.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#101319;--tx:#F2F4F7;--mut:#8D94A1;--tl:#27BDB1;--y:#F4CC38}
html,body{background:#000}
#e{width:1080px;position:relative;overflow:hidden;font-family:Mont;color:var(--tx);background:radial-gradient(1300px 1000px at 50% 40%,#1B212B 0%,var(--bg) 62%)}
.cab{position:absolute;left:48px;right:48px;display:flex;align-items:center;gap:20px}
.rec{flex:1;display:flex;align-items:center}
.et{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:700;color:var(--mut);white-space:nowrap}
.et i{width:11px;height:11px;border-radius:50%;background:#3A414D;display:block}
.tr{flex:1;height:3px;background:#2A313C;margin:0 10px;min-width:12px;position:relative;overflow:hidden}
.tr b{position:absolute;left:0;top:0;bottom:0;background:var(--tl);width:0}
.reloj{font-size:22px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.reloj b{color:var(--tx);font-weight:800;margin-left:8px}
.ej{position:absolute;left:48px;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6A7380}
#win{position:absolute;left:36px;width:1008px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.10)}
.capa{position:absolute;inset:0;overflow:hidden;opacity:0}
.capa img{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
.foco{position:absolute;border:5px solid var(--tl);border-radius:14px;box-shadow:0 0 0 10px rgba(39,189,177,.18);opacity:0}
.foco.am{border-color:var(--y);box-shadow:0 0 0 10px rgba(244,204,56,.22)}
#velo{position:absolute;inset:0;background:rgba(16,19,25,.92);opacity:0}
#gancho{position:absolute;left:64px;right:64px;display:flex;flex-direction:column;justify-content:center;font-weight:800;line-height:1.08;letter-spacing:-.01em}
#gancho div{position:absolute;left:0;right:0;opacity:0}
#gancho em{font-style:normal;color:var(--tl)}
#sub{position:absolute;left:56px;right:56px;text-align:center;line-height:1.16;font-weight:800;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#sub small{display:block;font-size:.5em;font-weight:700;color:var(--tl);margin-bottom:6px}
#llam{position:absolute;left:50%;transform:translateX(-50%);background:#0B0D11;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:16px 30px;display:flex;align-items:center;gap:16px;font-size:28px;font-weight:800;opacity:0;box-shadow:0 20px 50px rgba(0,0,0,.6);white-space:nowrap}
#llam .on{display:flex;align-items:center;gap:5px;height:40px}#llam .on i{width:6px;border-radius:3px;background:var(--tl);display:block}
#cierre{position:absolute;inset:0;opacity:0}
.tres{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;font-size:42px;font-weight:800}
.tres span{padding:0 6px}.tres u{display:block;height:3px;background:var(--tl);margin:0 14px;width:0}
.sobre{position:absolute;left:0;right:0;text-align:center;font-size:32px;font-weight:500;color:var(--mut)}
.logo{position:absolute;left:50%;transform:translateX(-50%);width:400px}
.cta{position:absolute;left:50%;transform:translateX(-50%);background:var(--tl);color:#06201E;font-size:40px;font-weight:800;padding:28px 50px;border-radius:18px;white-space:nowrap}
</style>
<div id="e">
 <div id="sup">
  <div class="cab" id="cab"><div class="rec">
   <div class="et" id="et0"><i></i>Solicitud</div><div class="tr"><b id="tr0"></b></div>
   <div class="et" id="et1"><i></i>Atención</div><div class="tr"><b id="tr1"></b></div>
   <div class="et" id="et2"><i></i>Seguimiento</div><div class="tr"><b id="tr2"></b></div>
   <div class="et" id="et3"><i></i>Matrícula</div></div>
   <div class="reloj" id="reloj"><b id="rj">00:00</b></div></div>
  <div class="ej" id="ej">Caso de ejemplo · datos simulados</div>
  <div id="win"><div id="velo"></div></div>
  <div id="llam"><span>Raquel · llamada</span><div class="on" id="on"></div></div>
  <div id="gancho"></div>
 </div>
 <div id="cierre"><div class="tres" id="tres"><span>Captación</span><u id="u1"></u><span>Atención</span><u id="u2"></u><span>Seguimiento</span></div>
  <div class="sobre" id="sobre">sobre las herramientas que ya utilizas</div><img class="logo" id="logo" src="rec/logo-blanco.png"><div class="cta" id="cta">Solicita un diagnóstico</div></div>
 <div id="sub"></div>
</div>
<script>
const Q=new URLSearchParams(location.search),VER=Q.get('ver')||'larga',AP=Q.get('ap')||'h1',FMT=Q.get('fmt')||'916';
document.write('<script src="subs-'+VER+'-'+AP+'.js"><\/script>');
</script>
<script>
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), nm=(t,a,b)=>cl((t-a)/(b-a),0,1), ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, $=id=>document.getElementById(id);
// ---- composición por formato (zonas seguras de Reels/Stories en 9:16) ----
const L=FMT==='45'?{H:1350,cab:40,ej:92,win:[132,800],sub:[956,58],llam:820,gan:[132,800,92],cierre:[330,420,560,800,1030]}
                 :{H:1920,cab:238,ej:292,win:[336,930],sub:[1292,64],llam:1150,gan:[336,930,100],cierre:[600,700,860,1130,1380]};
const W=1008,WH=L.win[1];
$('e').style.height=L.H+'px';$('cab').style.top=L.cab+'px';$('ej').style.top=L.ej+'px';
$('win').style.top=L.win[0]+'px';$('win').style.height=WH+'px';$('sub').style.top=L.sub[0]+'px';$('sub').style.fontSize=L.sub[1]+'px';
$('llam').style.top=L.llam+'px';const G=$('gancho');G.style.top=L.gan[0]+'px';G.style.height=L.gan[1]+'px';G.style.fontSize=L.gan[2]+'px';
$('tres').style.top=L.cierre[0]+'px';$('sobre').style.top=L.cierre[1]+'px';$('logo').style.top=L.cierre[2]+'px';$('cta').style.top=L.cierre[3]+'px';
// ---- planos: imagen, cámara [x,y,ancho] en píxeles de la captura y focos [x,y,w,h,amarillo] ----
const PL={
 LISTA:{img:'l1',cam:[474,500,930],foco:[[474,560,2356,118]]},
 ORIGEN:{img:'p1',cam:[0,96,820],foco:[[26,186,760,44]]},
 FORM:{img:'p1',cam:[0,980,930],foco:[[26,1076,1150,170]]},
 WA:{img:'cv2',cam:[1190,430,760],foco:[[1304,666,610,224]]},
 SINRESP:{img:'p5',cam:[30,2380,900],foco:[[60,2500,840,116]]},
 LLAMADA:{img:'p5',cam:[0,1650,1190],foco:[[26,1764,1150,330]]},
 RETOMAR:{img:'p6',cam:[0,1225,900],foco:[[26,1290,1150,410]]},
 AVISO:{img:'p6',cam:[30,2540,1150],foco:[[60,2778,1100,60]]},
 SI:{img:'cv8',cam:[1020,820,940],foco:[[1066,1154,350,114]]},
 MATRI:{img:'p9',cam:[0,96,820],foco:[[26,140,215,48,1],[26,188,760,44]]},
 PORQUE:{img:'p9',cam:[0,780,1190],foco:[[40,858,1120,138]]}
};
const T=window.T,a=T.a,e2=T.e2,e3=T.e3,rq=T.rq,e4=T.e4,e5=T.e5,e6=T.e6;
// secuencia: [plano, inicio]; cada plano dura hasta que empieza el siguiente
const SEC=VER==='larga'
 ?[['LISTA',0],['ORIGEN',e2+2.4],['FORM',e2+5.6],['WA',e3],['SINRESP',e3+2.4],['LLAMADA',rq],['RETOMAR',e4+2.1],['AVISO',e4+7.5],['SI',e5],['MATRI',e5+1.9]]
 :[['LISTA',0],['ORIGEN',e2],['SINRESP',e3],['LLAMADA',rq],['RETOMAR',e4],['SI',e5],['MATRI',e5+1.1]];
const win=$('win');SEC.forEach((s,i)=>{const p=PL[s[0]];const c=document.createElement('div');c.className='capa';c.id='c'+i;
 c.innerHTML='<img src="rec/'+p.img+'.png">'+p.foco.map((f,j)=>'<div class="foco'+(f[4]?' am':'')+'" id="f'+i+'_'+j+'"></div>').join('');win.insertBefore(c,$('velo'));});
const on=$('on');for(let i=0;i<16;i++)on.appendChild(document.createElement('i'));
// gancho en grande (los primeros segundos, hasta que empieza el cuerpo)
const GAN=AP==='h1'?[[0,2.25,'Conseguir solicitudes para tu academia <em>es una cosa.</em>'],[2.25,e2-.15,'Convertirlas en matrículas <em>es otra.</em>']]
                  :[[0,e2-.15,'¿Cuántas solicitudes de tu academia <em>se quedan sin seguimiento?</em>']];
GAN.forEach((g,i)=>{const d=document.createElement('div');d.id='g'+i;d.innerHTML=g[2];G.appendChild(d);});
const RELOJ=VER==='larga'?[[0,'00:00'],[e2+2.4,'00:04'],[e3,'+2 min'],[e3+2.4,'+1 día'],[e4+7.5,'enero'],[e5,'+8 semanas']]
                        :[[0,'00:00'],[e3,'+1 día'],[e4,'enero'],[e5,'+8 semanas']];
window.setT=function(t){
 SEC.forEach((s,i)=>{const p=PL[s[0]],c=$('c'+i),t0=s[1],t1=i<SEC.length-1?SEC[i+1][1]:e6+1;
  const o=i===0?(t<t1+.3?1:0):Math.min(nm(t,t0-.15,t0+.15),1-nm(t,t1-.0,t1+.3));c.style.opacity=o;if(o<=0)return;
  const u=ez(nm(t,t0,t1)),w=p.cam[2]*(1-.05*u),s2=W/w,x=p.cam[0]+(p.cam[2]-w)/2,y=p.cam[1]+12*u;
  c.firstChild.style.transform='translate('+(-x*s2)+'px,'+(-y*s2)+'px) scale('+s2+')';
  p.foco.forEach((f,j)=>{const d=$('f'+i+'_'+j);const fi=t0+.45+j*.9,fo=Math.min(nm(t,fi,fi+.25),1-nm(t,t1-.2,t1));d.style.opacity=(i===0&&t<e2)?0:fo;
   d.style.left=((f[0]-x)*s2-7)+'px';d.style.top=((f[1]-y)*s2-7)+'px';d.style.width=(f[2]*s2+14)+'px';d.style.height=(f[3]*s2+14)+'px';});});
 // gancho: velo sobre la pantalla y texto grande
 const gv=1-nm(t,e2-.35,e2);$('velo').style.opacity=gv;
 GAN.forEach((g,i)=>{const d=$('g'+i);const o=Math.min(nm(t,g[0],g[0]+.18),1-nm(t,g[1]-.18,g[1]));d.style.opacity=o;d.style.transform='translateY('+((1-ez(nm(t,g[0],g[0]+.3)))*18)+'px)';
  d.style.top=((L.gan[1]-d.offsetHeight)/2)+'px';});
 // recorrido
 const fase=t<e3?0:t<e4?1:t<e5?2:3;
 for(let i=0;i<4;i++){const e=$('et'+i),pt=e.firstChild,hecho=i<fase,ya=i===fase,col=i===3?'var(--y)':'var(--tl)';
  e.style.color=ya?col:hecho?'var(--tx)':'var(--mut)';pt.style.background=ya?col:hecho?'var(--tl)':'#3A414D';
  pt.style.boxShadow=ya?('0 0 0 7px '+(i===3?'rgba(244,204,56,.22)':'rgba(39,189,177,.2)')):'none';}
 $('tr0').style.width=(nm(t,e3-.5,e3)*100)+'%';$('tr1').style.width=(nm(t,e4-.5,e4)*100)+'%';$('tr2').style.width=(nm(t,e5-.5,e5)*100)+'%';
 let r=RELOJ[0][1];RELOJ.forEach(x=>{if(t>=x[0])r=x[1]});$('rj').textContent=r;
 // llamada de Raquel
 $('llam').style.opacity=Math.min(nm(t,rq,rq+.3),1-nm(t,e4-.4,e4-.1));
 [...on.children].forEach((b,i)=>{b.style.height=(8+32*Math.abs(Math.sin(t*7.3+i*1.7)*Math.cos(t*3.1+i*.9)))+'px';});
 // cierre
 const ci=nm(t,e6-.15,e6+.3);$('sup').style.opacity=1-ci;$('cierre').style.opacity=ci;
 if(VER==='larga'){$('u1').style.width=(ez(nm(t,e6+.9,e6+1.6))*70)+'px';$('u2').style.width=(ez(nm(t,e6+1.8,e6+2.5))*70)+'px';
  $('sobre').style.opacity=nm(t,e6+3.2,e6+3.8);$('logo').style.opacity=nm(t,e6+5.2,e6+5.8);$('cta').style.opacity=nm(t,e6+6.2,e6+6.8);}
 else{$('tres').style.opacity=0;$('sobre').style.opacity=0;$('logo').style.opacity=nm(t,e6,e6+.4);$('cta').style.opacity=nm(t,e6+.5,e6+.9);}
 // subtítulo
 const s=window.SUBS.find(x=>t>=x.s&&t<x.e),el=$('sub');
 if(s){el.innerHTML=(s.q?'<small>'+s.q+'</small>':'')+s.x;el.style.opacity=1;}else el.style.opacity=0;
 el.style.top=(t>=e6-.15?L.cierre[4]:L.sub[0])+'px';
};
window.DUR=T.FIN;window.setT(0);
</script>
</html>
