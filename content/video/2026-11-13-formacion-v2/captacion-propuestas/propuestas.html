<!DOCTYPE html><html lang="es"><meta charset="utf-8">
<!-- Formación V2 · escena de captación: dos propuestas de anuncio + landing de la academia ficticia «Escuela Norte».
     propuestas.html?p=a|b  →  lámina 2200×1600 (render.js). Todo es un caso de ejemplo. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2200px;height:1600px;background:#101319;color:#F2F4F7;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.tit{position:absolute;left:70px;top:44px;font-size:34px;font-weight:700}.tit small{display:block;font-size:20px;font-weight:500;color:#8D94A1;margin-top:6px}
.eti{position:absolute;font-size:17px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8D94A1}
.ad{position:absolute;left:70px;top:190px;width:1040px;height:1300px;overflow:hidden;border-radius:10px}
.tel{position:absolute;left:1290px;top:150px;width:660px;height:1380px;border-radius:54px;background:#000;padding:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pan{width:100%;height:100%;border-radius:40px;overflow:hidden;position:relative}
.url{height:58px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500}
img{display:block;object-fit:cover}

/* ---------- A · editorial ---------- */
.a .ad{background:#F5EFE4;color:#14213D}
.a .ad img{width:100%;height:770px;object-position:50% 30%}
.a .marca{font-family:Fraunces,serif;font-weight:600;font-size:34px;letter-spacing:-.01em}
.a .ad .marca{position:absolute;left:44px;top:36px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.a .ad .c{padding:40px 48px}
.a .kick{font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#C8553D}
.a h1{font-family:Fraunces,serif;font-weight:600;font-size:74px;line-height:1.02;letter-spacing:-.02em;margin:16px 0 18px}
.a .ad p{font-size:30px;line-height:1.3;color:#3B4660;max-width:820px}
.a .fila{position:absolute;left:48px;right:48px;bottom:44px;display:flex;align-items:center;justify-content:space-between}
.a .btn{background:#14213D;color:#F5EFE4;font-size:28px;font-weight:700;padding:22px 38px;border-radius:999px}
.a .ini{font-size:24px;font-weight:600;color:#3B4660}
.a .pan{background:#F5EFE4;color:#14213D}
.a .url{background:#E9E1D2;color:#5B6478}
.a .nav{display:flex;justify-content:space-between;align-items:center;padding:22px 30px}.a .nav .marca{font-size:28px}.a .nav span{font-size:17px;font-weight:600;border:1.5px solid #14213D;padding:9px 16px;border-radius:999px}
.a .hero{padding:10px 30px 0}.a .hero .kick{font-size:14px}.a .hero h1{font-size:47px;margin:12px 0 14px}.a .hero p{font-size:20px;line-height:1.4;color:#3B4660}
.a .dat{display:flex;gap:10px;margin:22px 0 22px}.a .dat div{flex:1;border-top:2px solid #14213D;padding-top:10px;font-size:15px;color:#5B6478}.a .dat b{display:block;font-size:19px;color:#14213D;margin-bottom:2px}
.a .pan img{width:100%;height:300px;object-position:50% 35%}
.a .form{margin:-46px 26px 0;position:relative;background:#fff;border-radius:22px;padding:26px;box-shadow:0 18px 40px rgba(20,33,61,.16)}
.a .form h3{font-family:Fraunces,serif;font-weight:600;font-size:27px;margin-bottom:16px}
.a .cam{border:1.5px solid #D9D2C3;border-radius:12px;padding:15px 16px;font-size:17px;color:#8A8F9C;margin-bottom:11px;display:flex;justify-content:space-between}
.a .form .btn{display:block;text-align:center;font-size:20px;padding:18px;margin-top:6px}
.a .leg{font-size:13px;color:#8A8F9C;text-align:center;margin-top:12px}

/* ---------- B · moderno ---------- */
.b{font-family:'DM Sans',sans-serif}
.b .ad{background:#0F3D3E;color:#fff}
.b .marca{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;display:flex;align-items:center;gap:12px}.b .marca i{width:30px;height:30px;border-radius:9px;background:#D7F36B;display:block}
.b .ad .marca{position:absolute;left:48px;top:44px}
.b .tag{position:absolute;right:48px;top:44px;font-size:21px;font-weight:700;background:rgba(255,255,255,.12);padding:10px 18px;border-radius:999px}
.b h1{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.03em;line-height:.98}
.b .ad h1{position:absolute;left:48px;top:150px;font-size:98px;width:940px}.b h1 em{font-style:normal;color:#D7F36B}
.b .ad img{position:absolute;left:48px;right:48px;top:560px;width:944px;height:470px;border-radius:28px;object-position:50% 30%}
.b .chips{position:absolute;left:48px;top:1062px;display:flex;gap:12px}.b .chips span{font-size:23px;font-weight:700;border:1.5px solid rgba(255,255,255,.4);padding:11px 20px;border-radius:999px}
.b .fila{position:absolute;left:48px;right:48px;bottom:46px;display:flex;align-items:center;justify-content:space-between}
.b .btn{background:#D7F36B;color:#0F3D3E;font-size:28px;font-weight:700;padding:22px 36px;border-radius:16px}
.b .ini{font-size:24px;font-weight:500;opacity:.85}
.b .pan{background:#fff;color:#0F2A2B}
.b .url{background:#EEF2F0;color:#5A6B6B}
.b .nav{display:flex;justify-content:space-between;align-items:center;padding:22px 28px}.b .nav .marca{font-size:23px}.b .nav .marca i{width:24px;height:24px;border-radius:7px;background:#0F3D3E}.b .nav span{font-size:16px;font-weight:700;background:#0F3D3E;color:#fff;padding:10px 16px;border-radius:10px}
.b .hero{margin:0 18px;background:#0F3D3E;color:#fff;border-radius:26px;padding:30px 26px 150px}
.b .hero .t{font-size:14px;font-weight:700;background:rgba(255,255,255,.12);display:inline-block;padding:7px 13px;border-radius:999px}
.b .hero h1{font-size:50px;margin:16px 0 14px}.b .hero p{font-size:19px;line-height:1.4;opacity:.9}
.b .pan img{width:calc(100% - 68px);margin:-124px 34px 0;height:240px;border-radius:20px;position:relative;object-position:50% 30%}
.b .dat{display:flex;gap:10px;margin:18px 18px}.b .dat div{flex:1;background:#EEF2F0;border-radius:14px;padding:13px;font-size:14px;color:#5A6B6B}.b .dat b{display:block;font-size:18px;color:#0F2A2B}
.b .form{margin:0 18px;border:1.5px solid #DCE4E1;border-radius:22px;padding:22px}
.b .form h3{font-family:'Space Grotesk',sans-serif;font-size:24px;margin-bottom:14px}
.b .cam{background:#F4F7F5;border-radius:12px;padding:15px 16px;font-size:17px;color:#7C8B8A;margin-bottom:10px;display:flex;justify-content:space-between}
.b .form .btn{display:block;text-align:center;font-size:20px;padding:17px;background:#0F3D3E;color:#fff;border-radius:12px;margin-top:4px}
.b .leg{font-size:13px;color:#7C8B8A;text-align:center;margin-top:11px}
</style>
<body>
<script>

document.body.innerHTML+= P==='a' ? `

<div class="tit">Propuesta B · Moderna<small>Escuela Norte es una academia ficticia · Caso de ejemplo para el vídeo de Qualivo</small></div>
<div class="eti" style="left:70px;top:150px">Anuncio (4:5)</div><div class="eti" style="left:1290px;top:106px">Landing (móvil)</div>

<div class="tel"><div class="pan"><div class="url">escuelanorte.example/curso-de-tarde</div>

 ${form('Recibe horarios y precio','Quiero información')}</div></div>`;
</script>
</body></html>
