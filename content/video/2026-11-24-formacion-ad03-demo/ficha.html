<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- Entrada de la demo corta: la ficha de la solicitud del anuncio original (fotogramas recortados del vídeo) recompuesta con una entrada
     más fuerte: llega desde abajo, se asienta grande y la cámara se acerca mientras sube la prioridad. window.setF(i,n) → promesa. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#1FA396;perspective:1800px}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(1000px 1000px at 50% 52%,rgba(120,235,220,.42),transparent 62%),radial-gradient(1500px 1500px at 50% 50%,transparent 55%,rgba(6,58,53,.5) 100%)}
#g{position:absolute;left:100px;top:700px;width:880px;height:641px;transform-origin:50% 60%;will-change:transform}
#som{position:absolute;inset:30px 20px -40px;border-radius:60px;background:rgba(4,40,36,.55);filter:blur(46px)}
#card{position:absolute;inset:0;border-radius:42px;overflow:hidden}
#card img{position:absolute;left:-100px;top:-350px}
#tag{position:absolute;left:4px;top:-66px;width:602px;height:74px;border-radius:14px 14px 0 0;overflow:hidden;transform-origin:0 100%}
#tag img{position:absolute;left:-104px;top:-284px}
#aro{position:absolute;inset:-10px;border-radius:52px;border:8px solid #F4CC38;opacity:0}
</style></head><body>
<div id="g"><div id="som"></div><div id="tag"><img id="i2"></div><div id="card"><img id="i1"></div><div id="aro"></div></div>
<script>
const cl=x=>Math.max(0,Math.min(1,x)), nm=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,v)=>a+(b-a)*v, expo=x=>x>=1?1:1-Math.pow(2,-10*x), io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, back=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, pico=x=>Math.sin(cl(x)*Math.PI);
const DIR=new URLSearchParams(location.search).get('f');
window.setF=async(i,n)=>{ const t=i/25, D=n/25, src=DIR+'/f'+String(i).padStart(5,'0')+'.jpg'; i1.src=src; i2.src=src; await Promise.all([i1.decode(),i2.decode()]);
  const a=nm(t,.04,.6), e=back(a), z=io(nm(t,.7,D)), pu=pico(nm(t,2.75,3.15));
  g.style.opacity=Math.min(1,a*4); g.style.filter=a<1?`blur(${(14*(1-a)).toFixed(1)}px)`:'none';
  g.style.transform=`translateY(${lerp(760,0,e)-70*z}px) rotateX(${lerp(26,0,expo(a))}deg) rotateZ(${lerp(-7,0,expo(a))}deg) scale(${lerp(.62,1.02,e)+.16*z+.025*pu})`;
  const tg=nm(t,.5,.75); tag.style.opacity=Math.min(1,tg*3); tag.style.transform=`translateY(${(1-expo(tg))*50}px)`;
  aro.style.opacity=pu; aro.style.transform=`scale(${1+.03*pu})`; };
</script></body></html>
