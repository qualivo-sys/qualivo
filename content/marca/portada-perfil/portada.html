<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(../../../assets/fonts/montserrat-latin.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#08090C}
.c{position:relative;width:1920px;height:1080px;background:#08090C;font-family:M,Arial,sans-serif;color:#fff;overflow:hidden}
.glow{position:absolute;right:-260px;top:-300px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(39,189,177,.28),rgba(39,189,177,0) 62%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}
.logo{position:absolute;left:120px;top:96px;height:120px}
h1{position:absolute;left:120px;top:300px;width:1180px;font-weight:900;font-size:92px;line-height:1.02;letter-spacing:-.035em}
h1 em{font-style:normal;color:#27BDB1}
.sub{position:absolute;left:124px;top:640px;font-size:34px;font-weight:600;color:#B7C0CC;letter-spacing:-.01em}
.flow{position:absolute;right:120px;top:124px;display:flex;align-items:center;gap:18px}
.chip{padding:18px 30px;border-radius:999px;border:2px solid rgba(183,240,234,.35);font-size:28px;font-weight:700;color:#E8FBF8;background:rgba(16,19,25,.8)}
.chip.on{background:#27BDB1;border-color:#27BDB1;color:#04231F}
.ar{font-size:30px;color:#27BDB1;font-weight:800}
.url{position:absolute;left:124px;bottom:118px;font-size:30px;font-weight:800;color:#7CE8DD;letter-spacing:.01em}
</style></head><body><div class="c">
<div class="grid"></div><div class="glow"></div>
<img class="logo" src="../../video/2026-09-17-sistema/rec/logo-blanco.png" alt="Qualivo">
<h1>Te decimos dónde se te escapa el dinero <em>entre el anuncio y el cierre.</em></h1>
<div class="sub">Agentes de IA dentro de tu sistema de captación y ventas</div>
<div class="url">qualivo.io</div>
<div class="flow"><span class="chip">Anuncio</span><span class="ar">→</span><span class="chip">Contacto</span><span class="ar">→</span><span class="chip">Cita</span><span class="ar">→</span><span class="chip on">Venta</span></div>
</div></body></html>
