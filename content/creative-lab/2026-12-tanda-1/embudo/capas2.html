<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- Capa gráfica de «El embudo agujereado» v2. Sobre los planos de miniatura solo hay una línea de texto pequeña, colocada por debajo de la acción;
     la demostración son tres momentos con capturas reales: campañas → seguimiento → qué anuncios generan matrículas. Zona útil para 4:5: y entre 285 y 1635. -->
<script src="t-2.js"></script>
<style>
@font-face{font-family:Anton;src:url(../../../anuncios/2026-09-11-v2/fuentes/anton.ttf)}
@font-face{font-family:SG;src:url(../../../anuncios/2026-09-11-v2/fuentes/spacegrotesk.woff2);font-weight:300 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:SG,sans-serif}
.esc{position:absolute;inset:0;opacity:0;overflow:hidden}
#sub{position:absolute;left:0;right:0;text-align:center;opacity:0}
#sub b{display:inline-block;max-width:980px;font-weight:700;color:#fff;background:rgba(10,12,12,.88);padding:12px 26px 16px;border-radius:16px;line-height:1.12}
#sub.g b{font-family:Anton;font-weight:400;text-transform:uppercase;letter-spacing:.01em;padding:14px 30px 16px}
.et{position:absolute;left:60px;top:325px;font-family:Anton;font-size:70px;text-transform:uppercase;line-height:1.02}
.et i{font-style:normal;color:#C8743A}
#camp{background:#FFFFFF}#camp .et{color:#14201E}
#camp .cap{position:absolute;left:0;top:500px;width:1080px;height:832px;overflow:hidden}
#camp .cap img{position:absolute;left:0;top:0;height:1222px;max-width:none;will-change:transform}
#camp .hl{position:absolute;border:6px solid #C8743A;background:rgba(200,116,58,.12);border-radius:16px;opacity:0}
#wa{background:#0B141A}#wa .et{color:#F4EFE4}
#wa .cap{position:absolute;left:60px;top:520px;width:960px;height:660px;overflow:hidden;border-radius:36px}
#wa .cap img{position:absolute;left:0;top:-196px;width:960px}#wa .tapa{position:absolute;left:0;right:0;bottom:0;background:#0B141A}
#fin{background:#0A0F0E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;text-align:center}
#fin::before{content:"";position:absolute;inset:0;background:radial-gradient(800px 800px at 50% 50%,rgba(200,116,58,.28),transparent 65%)}
#fin img{width:430px;position:relative}#fin .l{position:relative;font-family:Anton;font-size:78px;line-height:1.08;text-transform:uppercase;color:#F4EFE4;max-width:940px}#fin .l i{font-style:normal;color:#E39A63}
#fin .cta{position:relative;font-family:Anton;font-size:54px;text-transform:uppercase;background:#F4CC38;color:#0A0A0B;padding:22px 44px;border-radius:999px}
#fin .p{position:relative;font-weight:500;font-size:34px;color:#B9C4C0}
</style></head><body>
<div class="esc" id="camp"><div class="et" id="et1">Tus <i>campañas</i></div><div class="et" id="et3">Qué anuncios generan <i>matrículas</i></div>
  <div class="cap"><img src="intel-campanas.png"><div class="hl" id="hm"></div><div class="hl" id="hv"></div></div></div>
<div class="esc" id="wa"><div class="et">El <i>seguimiento</i></div><div class="cap"><img src="../../../anuncios/2026-11-24-bateria-formacion/cap/whatsapp.png"><div class="tapa"></div></div></div>
<div class="esc" id="fin"><img src="../../../video/2026-09-17-sistema/rec/logo-blanco.png"><div class="l">Descubre dónde pierde <i>oportunidades</i> tu escuela</div><div class="cta">Solicita tu diagnóstico gratuito</div><div class="p">Captación, seguimiento y mejora continua</div></div>
<div id="sub"><b></b></div>
<script>
const J=window.J; window.DUR=J.DUR; const B=J.B, P=Object.fromEntries(J.P.map(p=>[p.tipo,p]));
const cl=x=>Math.max(0,Math.min(1,x)), nm=(t,a,b)=>cl((t-a)/(b-a)), expo=x=>x>=1?1:1-Math.pow(2,-10*x), io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const SC=1.3, PAN=1422*SC-1080;      // escala de la tabla y recorrido del desplazamiento
// posición y tamaño del texto en cada plano: por debajo de la acción en los planos de miniatura
const POS={pour:[1500,58,1],macro:[1470,50,0],sol:[1400,50,0],tape:[1525,46,0]};
window.setT=t=>{ const en=k=>t>=P[k].t0&&t<P[k].t0+P[k].d, s=P.sol;
  const b1=t>=s.t0&&t<B.b2, b2=t>=B.b2&&t<B.b3, b3=t>=B.b3&&t<s.t0+s.d;
  camp.style.opacity=(b1||b3)?1:0; wa.style.opacity=b2?1:0; fin.style.opacity=en('fin')?1:0;
  // subtítulo: una línea cada vez
  const sb=document.getElementById('sub'); let tx='', k='';
  for(const p of J.P){ if(!p.lin.length)continue; p.lin.forEach((l,i)=>{ const a=p.tv+p.lt[i]-.06, b=i<p.lin.length-1?p.tv+p.lt[i+1]-.06:p.tv+p.dv+.35; if(t>=a&&t<b){tx=l;k=p.tipo;} }); }
  sb.style.opacity=tx?1:0; if(tx){ const q=POS[k]; sb.style.top=q[0]+'px'; sb.firstChild.style.fontSize=q[1]+'px'; sb.className=q[2]?'g':''; sb.firstChild.textContent=tx; }
  // campañas (b1): parte izquierda de la tabla; matrículas (b3): desplazamiento a la derecha y columnas marcadas
  { const im=document.querySelector('#camp img'), x=b3?PAN*io(nm(t,B.b3+.1,B.b3+1.3)):0; im.style.transform=`translateX(${-x}px)`;
    et1.style.opacity=b1?nm(t,s.t0+.05,s.t0+.3):0; et3.style.opacity=b3?nm(t,B.b3+.05,B.b3+.3):0;
    const m=(id,x0,y0,w,h,a)=>{const e=document.getElementById(id); e.style.left=(x0*SC-x)+'px'; e.style.top=y0*SC+'px'; e.style.width=w*SC+'px'; e.style.height=h*SC+'px'; e.style.opacity=b3?nm(t,a,a+.2):0;};
    m('hm',826,80,192,552,B.mat); m('hv',1030,84,330,552,B.mat+.5); }
  { const n=[.25,1.15].filter(x=>t>=B.b2+x).length, h=660-(n?[376,645][n-1]:0); document.querySelector('#wa .tapa').style.height=Math.max(0,h)+'px'; document.querySelector('#wa .et').style.opacity=b2?nm(t,B.b2+.05,B.b2+.3):0; }
  { const a=P.fin.t0, e=[fin.querySelector('img'),fin.querySelector('.l'),fin.querySelector('.cta'),fin.querySelector('.p')]; e.forEach((x,i)=>{const v=nm(t,a+.1+i*.3,a+.4+i*.3); x.style.opacity=v; x.style.transform=`translateY(${(1-expo(v))*30}px)`;}); }
};
window.listo=true; window.setT(0);
</script></body></html>
