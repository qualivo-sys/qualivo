<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- Capa gráfica de «El embudo agujereado»: transparente sobre los planos de miniatura (solo rótulo o subtítulo) y opaca en las tres capturas reales y el cierre.
     Todo lo importante va entre y=285 y y=1635 para que el recorte 4:5 no pierda nada. window.setT(t). Variante por ?v=A|B. -->
<style>
@font-face{font-family:Anton;src:url(../../../anuncios/2026-09-11-v2/fuentes/anton.ttf)}
@font-face{font-family:SG;src:url(../../../anuncios/2026-09-11-v2/fuentes/spacegrotesk.woff2);font-weight:300 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:SG,sans-serif}
.esc{position:absolute;inset:0;opacity:0;overflow:hidden}
#velo{position:absolute;left:0;right:0;top:1090px;height:830px;background:linear-gradient(180deg,rgba(244,236,219,0) 0%,rgba(244,236,219,.93) 22%,rgba(244,236,219,.96) 100%);opacity:0}
#gancho{position:absolute;left:64px;right:64px;top:1275px;font-family:Anton;font-size:80px;line-height:1.05;text-transform:uppercase;color:#17120C;}
#gancho span{display:inline-block;opacity:0}#gancho i{font-style:normal;color:#9A4A16}
#sub{position:absolute;left:0;right:0;top:1410px;text-align:center;opacity:0}
#sub b{display:inline-block;max-width:940px;font-weight:700;font-size:50px;line-height:1.14;color:#fff;background:rgba(10,12,12,.86);padding:14px 26px 18px;border-radius:18px}
.et{position:absolute;left:64px;top:330px;font-family:Anton;font-size:76px;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:22px}
.et u{text-decoration:none;display:inline-flex;width:96px;height:96px;border-radius:50%;align-items:center;justify-content:center;background:#C8743A;color:#fff}
#wa{background:#0B141A}#wa .et{color:#F4EFE4}
#wa .cap,#conv .cap{position:absolute;left:60px;top:520px;width:960px;height:660px;overflow:hidden;border-radius:36px}
#wa .cap img{position:absolute;left:0;top:-196px;width:960px}#conv .cap img{position:absolute;left:0;top:-821px;width:960px}
#wa .tapa,#conv .tapa{position:absolute;left:0;right:0;bottom:0;background:#0B141A}
#conv{background:#0B141A}#conv .et{color:#F4EFE4}
#intel{background:#FFFFFF}#intel .et{color:#14201E}
#intel .cap{position:absolute;left:0;top:520px;width:1080px;height:840px;overflow:hidden}
#intel .cap img{position:absolute;left:0;top:0;height:840px;will-change:transform}
#fin{background:#0A0F0E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center}
#fin::before{content:"";position:absolute;inset:0;background:radial-gradient(800px 800px at 50% 50%,rgba(200,116,58,.28),transparent 65%)}
#fin img{width:470px;position:relative}#fin .l{position:relative;font-family:Anton;font-size:74px;line-height:1.08;text-transform:uppercase;color:#F4EFE4;max-width:900px}#fin .l i{font-style:normal;color:#5FE0CF}
#fin .cta{position:relative;font-family:Anton;font-size:56px;text-transform:uppercase;background:#F4CC38;color:#0A0A0B;padding:22px 44px;border-radius:999px}
#fin .p{position:relative;font-weight:500;font-size:36px;color:#B9C4C0}
</style></head><body>
<div id="velo"></div><div id="gancho"></div>
<div class="esc" id="wa"><div class="et"><u>1</u>Respuesta</div><div class="cap"><img src="../../../anuncios/2026-11-24-bateria-formacion/cap/whatsapp.png"><div class="tapa"></div></div></div>
<div class="esc" id="conv"><div class="et"><u>2</u>Cualificación</div><div class="cap"><img src="../../../anuncios/2026-11-24-bateria-formacion/cap/whatsapp.png"><div class="tapa"></div></div></div>
<div class="esc" id="intel"><div class="et"><u>3</u>Seguimiento</div><div class="cap"><img src="../../../anuncios/2026-11-24-bateria-formacion/cap/oportunidades.png"></div></div>
<div class="esc" id="fin"><img src="../../../video/2026-09-17-sistema/rec/logo-blanco.png"><div class="l">Captación, seguimiento y <i>mejora continua</i></div><div class="cta">Solicita tu diagnóstico gratuito</div><div class="p">Para escuelas de formación online</div></div>
<div id="sub"><b></b></div>
<script>
const V=new URLSearchParams(location.search).get('v')||'A';
const cl=x=>Math.max(0,Math.min(1,x)), nm=(t,a,b)=>cl((t-a)/(b-a)), expo=x=>x>=1?1:1-Math.pow(2,-10*x), io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const HOOK={A:'¿De qué sirve conseguir más alumnos potenciales <i>si los pierdes por el camino?</i>',B:'Antes de invertir más en publicidad, <i>mira por dónde se te escapan.</i>'};
let J; const s=document.createElement('script'); s.src='t-'+V+'.js'; s.onload=()=>{J=window.J; window.DUR=J.DUR;
  // el gancho, palabra a palabra
  const g=document.getElementById('gancho'); g.innerHTML=HOOK[V].replace(/(<i>|<\/i>)/g,' $1 ').split(/\s+/).filter(Boolean).reduce((a,w)=>{ if(w=='<i>'){a.i=1;return a} if(w=='</i>'){a.i=0;return a} a.h+=(a.i?'<i>':'')+'<span>'+w+'</span>'+(a.i?'</i>':'')+' '; return a},{h:'',i:0}).h;
  window.listo=true; window.setT(0); }; document.head.appendChild(s);
const WA=[376,645], CV=[176,387,540];   // borde inferior de cada burbuja, en px de la captura mostrada
window.setT=t=>{ if(!J)return; const P=Object.fromEntries(J.P.map(p=>[p.tipo,p])); const en=k=>t>=P[k].t0&&t<P[k].t0+P[k].d, u=k=>nm(t,P[k].t0,P[k].t0+P[k].d);
  ['wa','conv','intel','fin'].forEach(k=>document.getElementById(k).style.opacity=en(k)?1:0);
  // gancho sobre el primer plano
  const g=document.getElementById('gancho'), p0=P.pour; g.style.opacity=en('pour')?1-nm(t,p0.t0+p0.d-.25,p0.t0+p0.d):0; document.getElementById('velo').style.opacity=en('pour')?nm(t,p0.tv-.2,p0.tv+.15)*(1-nm(t,p0.t0+p0.d-.25,p0.t0+p0.d)):0; const sp=[...g.querySelectorAll('span')], paso=Math.min(.22,(p0.dv-.3)/sp.length);
  sp.forEach((e,i)=>{const v=nm(t,p0.tv+i*paso-.05,p0.tv+i*paso+.12); e.style.opacity=v; e.style.transform=`translateY(${(1-expo(v))*24}px)`;});
  // subtítulo (todo menos el gancho y el cierre)
  const sb=document.getElementById('sub'), q=J.P.find(p=>p.tipo!='pour'&&p.tipo!='fin'&&t>=p.tv-.05&&t<p.tv+p.dv+.3); sb.style.opacity=q?1:0; if(q)sb.firstChild.textContent=q.txt;
  // etiquetas numeradas
  ['wa','conv','intel'].forEach(k=>{const e=document.querySelector('#'+k+' .et'), v=nm(t,P[k].t0+.05,P[k].t0+.3); e.style.opacity=v; e.style.transform=`translateX(${(1-expo(v))*-50}px)`;});
  // WhatsApp: las burbujas aparecen de una en una
  { const k='wa', a=P[k].t0, n=[.3,1.5].filter(x=>t>=a+x).length, h=660-(n?WA[n-1]:0); document.querySelector('#wa .tapa').style.height=Math.max(0,h)+'px'; document.querySelector('#wa .cap').style.transform=`scale(${1+.03*u(k)})`; }
  { const k='conv', a=P[k].t0, n=[.25,1.1,2.0].filter(x=>t>=a+x).length, h=660-(n?CV[n-1]:0); document.querySelector('#conv .tapa').style.height=Math.max(0,h)+'px'; document.querySelector('#conv .cap').style.transform=`scale(${1+.03*u(k)})`; }
  { const k='intel', im=document.querySelector('#intel img'); im.style.transform=`translateX(${-(1693-1080)*io(nm(u(k),.12,.9))}px)`; }
  // cierre
  { const k='fin', a=P[k].t0, f=document.getElementById('fin'); const e=[f.querySelector('img'),f.querySelector('.l'),f.querySelector('.cta'),f.querySelector('.p')]; e.forEach((x,i)=>{const v=nm(t,a+.1+i*.28,a+.4+i*.28); x.style.opacity=v; x.style.transform=`translateY(${(1-expo(v))*30}px) scale(${i==2?.9+.1*expo(v):1})`;}); }
};
</script></body></html>
