.ad1 .t:nth-child(odd)::after{right:-15px}.ad1 .t:nth-child(even)::before{left:-15px}

.ad1b .t.w{grid-column:1/-1;justify-content:center}.ad1b .t.w::before,.ad1b .t.w::after{display:none}
