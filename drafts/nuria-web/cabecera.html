<script>
  // Menú en móvil: abre y cierra la lista al pulsar el botón
  (function(){
    var nav = document.querySelector('#nrq .nav');
    var btn = nav && nav.querySelector('.nav-toggle');
    if(!btn) return;
    function cerrar(){ nav.classList.remove('is-open'); btn.setAttribute('aria-expanded','false'); btn.setAttribute('aria-label','Abrir menú'); }
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var abierto = nav.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      btn.setAttribute('aria-label', abierto ? 'Cerrar menú' : 'Abrir menú');
    });
    nav.querySelectorAll('.nav-links a').forEach(function(a){ a.addEventListener('click', cerrar); });
    document.addEventListener('click', function(e){ if(!nav.contains(e.target)) cerrar(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') cerrar(); });
    window.addEventListener('resize', function(){ if(window.innerWidth > 860) cerrar(); });
  })();

  // Ajusta dinámicamente el espaciador para que el contenido no quede tapado por el sticky-top fijo
  (function(){
    var stack = document.querySelector('#nrq .sticky-top');
    var spacer = document.getElementById('stickySpacer');
    if(!stack || !spacer) return;
    function sync(){ spacer.style.height = stack.offsetHeight + 'px'; }
    sync();
    window.addEventListener('resize', sync);
    // En caso de que se cargue una fuente y cambie la altura del banner
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(sync); }
    // Observa cambios internos (p.ej. si cierran el banner con ×)
    if(window.ResizeObserver){
      new ResizeObserver(sync).observe(stack);
    }
  })();
</script>
<script>(function(){var p=location.pathname.replace(/\/$/,'');document.querySelectorAll('#nrq .nav-links a').forEach(function(a){try{var q=new URL(a.href).pathname.replace(/\/$/,'');if(q&&q===p&&a.host===location.host)a.classList.add('is-here')}catch(e){}})})();</script>
